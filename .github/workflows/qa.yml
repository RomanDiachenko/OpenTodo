# Qualinaut pipeline (GitHub Actions), written by `qlt ci`. Edit freely.
# Made from project.yaml 652cb8ff22e1: `qlt doctor` says when it has changed.
# Fast job: committed generated tests (smoke or healthcheck) on every change.
# Scheduled job (0 22 * * *): `qlt run tests`, fails past `never`.
# Set these as CI secrets: QLT_GITHUB_TOKEN.
# QLT_GITHUB_TOKEN: a token that can read RomanDiachenko/qualinaut releases (Contents: read); qlt-install.py installs Qualinaut 0.5.8.16 with it.
# No generated web tests yet: run `qlt run tests` and commit them.
# Round summary: a last job (`round`) sums up every scheduled job from their artifacts (`qlt round`), in its job summary and the artifact `qa-round`.

name: qa
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 0 22 * * *
  workflow_dispatch:
    inputs:
      target:
        description: 'Explore only this target (its id; empty: every target)'
        required: false
        default: ''
        type: string
      chain:
        description: 'Set by the workflow itself: which run of a chain going on with an unfinished exploration (0: a new one)'
        required: false
        default: '0'
        type: string
jobs:
  explore:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == '' || inputs.target == 'web'))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: qlt-${{ github.workflow }}-explore
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      QLT_CHAIN: ${{ inputs.chain || '0' }}
      QLT_CONTINUE: ${{ (inputs.chain || '0') != '0' && '--set ui-explorer.continue_unfinished=true' || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python qlt-install.py
    - run: playwright install --with-deps chromium
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: build web
      run: cd web && npm ci --no-audit --no-fund && npm run build && cd .. && CGO_ENABLED=0 go build -trimpath -o bin/opentodo ./cmd/opentodo
    - uses: actions/cache/restore@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm

          .qlt/baseline'
        key: qlt-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: qlt-cache-
    - run: qlt doctor
    - run: qlt run tests --fail-on never --time 5h $QLT_CONTINUE
    - name: changes since the previous run
      if: '!cancelled()'
      run: "if [ -f \".qlt/baseline/web.json\" ]; then\n  qlt agent behavior-comparator --target web --set behavior-comparator.baseline=.qlt/baseline --fail-on never || true\nfi\nqlt agent golden-recorder --target web --set golden-recorder.output=.qlt/baseline --fail-on never || true\n"
    - if: always()
      uses: actions/cache/save@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm

          .qlt/baseline'
        key: qlt-cache-${{ github.run_id }}-${{ github.run_attempt }}
    - name: go on in a next run if the map is unfinished
      if: '!cancelled() && github.event_name != ''pull_request'''
      env:
        GH_TOKEN: ${{ github.token }}
      run: "chain=\"${QLT_CHAIN:-0}\"\nworkflow=\"${GITHUB_WORKFLOW_REF%@*}\"\nworkflow=\"${workflow##*/}\"\nif [ \"$chain\" -ge 20 ]; then\n  echo \"20 runs in a row: not going on (start the workflow to go on)\"\n  exit 0\nfi\nif qlt unfinished; then\n  gh workflow run \"$workflow\" -R \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f target= -f chain=$((chain + 1))\nfi\n"
    - if: always()
      run: qlt report --format md >> "$GITHUB_STEP_SUMMARY" || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa
        path: '.qlt/artifacts

          generated-tests

          golden'
  round:
    needs:
    - explore
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python qlt-install.py
    - name: the artifacts of the round's jobs
      uses: actions/download-artifact@v4
      with:
        pattern: qa*
        path: ${{ runner.temp }}/qlt-round
    - name: one summary of the round
      env:
        QLT_NEEDS: ${{ toJSON(needs) }}
      run: 'echo "$QLT_NEEDS" > needs.json

        qlt round ${{ runner.temp }}/qlt-round --jobs needs.json --output qa-round >> "$GITHUB_STEP_SUMMARY"

        '
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-round
        path: qa-round
